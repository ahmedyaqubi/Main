[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
# Split paths on the OS separator only: this repo lives under a path with a space.
path_separator = os
# The database URL is never stored here: env.py reads DATABASE_URL from the environment / .env
# (or `-x url=...` / config attribute when called from tests).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
