# Phase 1 parameters — v1.0, mirrors docs/PHASE_1_SPEC.md (FROZEN, ADR-0001).
# Changing any value here requires an ADR.
# T-CFG-01 checks that every `config:` key named in the spec exists here.

history:
  option_era_start: "2023-03-28"   # ADR-0003 (was 2022-11-14)
  underlying_start: "2023-03-28"   # OD-1, ADR-0003
  # Sessions removed from all research use, each with its ADR (logged, never silent).
  excluded_sessions:
    - date: "2023-12-27"
      adr: "ADR-0006"
      reason: "OCC #53847 ex-date: vendor lists superseded pre-adjustment series quoted 0/0 all day"

session:
  calendar: XNYS
  timezone: America/New_York
  ignore_post_close_options: true

schedule:
  cadence_minutes: 5
  first: "09:45"
  last_new_entry: "15:00"
  early_close_last_entry_offset_min: 60

trade:
  forced_exit_time: "15:50"
  early_close_forced_exit_offset_min: 10
  max_holding_minutes: 90
  allow_overnight: false             # OD-2
  contracts: 1
  max_open_positions: 1
  max_entries_per_day: 3
  breakeven_band: 0.02

labels:
  version: "L2"                     # L2: D stop/target per ADR-0007 (L1 superseded)
  horizon_minutes: 90
  direction:
    deadband: 0.0005
  magnitude:
    thresholds: [0.0025, 0.0050]     # OD-10: first is primary
  option:
    target_pct: 0.30
    stop_pct: 0.20
    max_path_gap_minutes: 5          # M6 Q3: longer quote gaps -> UNRESOLVED_DATA
  risk:
    stop: 0.0019                     # ADR-0007 (was 0.0015)
    target: 0.0030                   # ADR-0007 (was the primary magnitude threshold, 0.0025)

decision:
  edge_margin: 0.03
  ev_model: binary_conservative      # M15 Q1: non-WIN outcomes treated as the full stop loss
  ev_fill_model: MODERATE            # §4.1: EV after costs at the moderate fill
  model_family: gbm_m2               # M15 Q2: calibrated C_call / C_put probabilities used
  blocked_regime_cells: []           # gate 13 mechanism (M15 Q4): cells set to NO_TRADE by rule
  min_calibration_support: 200       # ADR-0010: calibration-block rows with raw score >= current

selection:
  rule: atm_first_otm_no_fallback    # OD-3
  rule_version: "1"

costs:
  commission_per_contract: 0.65
  fees_per_contract: 0.05

liquidity:
  max_quote_age_s: 60
  max_spread_abs: 0.05
  max_spread_pct: 0.05
  min_bid: 0.20
  require_size: true

fills:
  latency_s: 5
  moderate_alpha: 0.5                # OD-6
  tick: 0.01

calibration:                         # M13 (spec Phase 1L, gate 12)
  methods: [none, temperature, platt, isotonic]   # candidates; ties -> earlier (simpler) wins
  inner_split: 0.5                   # chronological share of calibration sessions used to fit
                                     # when choosing the method (rest scores it); then refit on all
  prob_clip: 1.0e-4                  # calibrated probabilities clipped to [clip, 1 - clip]
  reference_runs:                    # saved model artifacts calibrated here
    logistic_m1: walk_forward-ae9e9d38408f
    gbm_m2: walk_forward-8adbdf4112a5
  gate12:
    ece_max: 0.03
    slope_min: 0.8
    slope_max: 1.2
    bin_min_n: 200                   # bins with n >= this must pass the Wilson check
    wilson_level: 0.95               # family-wise; per-bin level = 1 - 0.05 / k (ADR-0009)
    bin_rule: adr-0009-bonferroni

regimes:                             # M14 (spec §9, OD-9); thresholds fit per fold on training sessions
  version: R1
  vix_quantiles: [0.3333333333333333, 0.6666666666666666]   # LOW / NORMAL / HIGH
  extreme_vix: 30.0                  # EXTREME merged into HIGH; training sessions >= this are counted
  er_window_sessions: 20             # efficiency ratio over 20 daily moves to the prior close
  macro_events: [CPI, FOMC, NFP]
  low_support_sessions: 30           # cell flagged LOW_SUPPORT below this many sessions ...
  low_support_trades: 100            # ... or below this many trades (trade tables)
  calibration_runs:                  # M13 runs whose calibrators give the probabilities analysed
    logistic_m1: calibration-4deeb5149539
    gbm_m2: calibration-e19b6c392dd0
  baseline_run: sensitivity-1097416fc6c0   # M12 run: mechanical baseline trades (named models)

features_f3:                         # M19R Stage 2 E1: extras on top of the stored f2 snapshots
  version: f3                        # f3 row = f2 features + these extras (data/features/f3x)
  extras_dir: f3x
  option_mom_minutes: [5, 15]
  pc_change_minutes: 15
  extra_features: [opt_call_mom_5m, opt_put_mom_5m, opt_call_mom_15m, opt_put_mom_15m,
                   pc_imbalance_chg_15m, opt_call_size_imb, opt_put_size_imb, qqq_book_imb]

research:                            # M19R research iteration 1 (diagnostics D1-D3)
  implied_c: 1.0e6                   # D1 benchmark logistic: effectively unregularised
  next_session_minutes: 390          # D1: trading minutes of the expiry session (D+1)
  lift_quantiles: [0.9, 0.98, 0.99]  # D2: top decile, top 2%, top 1% (plus all deciles)
  ablation_targets: [A_up, A_dn, C_call, C_put]
  feature_groups:                    # D3: pre-declared, every f2 feature in exactly one group
    price_path: [vwap_dist, ret_since_prev_close, dist_prev_high, dist_prev_low, or_position,
                 overnight_gap, range_atr]
    momentum: [ret_5m, ret_15m, ret_30m, ret_60m, mom_accel]
    volatility: [rv_30m, vix_prev_close, straddle_move, atm_spread_pct]
    cross_asset: [spy_qqq_rel_15m, soxx_ret_15m, megacap_ret_15m, uup_ret_60m, ief_ret_60m,
                  shy_ret_60m]
    options_flow: [put_call_imbalance]
    volume: [rel_volume]
    calendar: [minutes_since_open, day_of_week, cal_days_to_expiry, macro_event_today]

validation_gates:                    # M19: spec §11 numbers (gates 6, 10, 13, 15, 16)
  min_folds_better_share: 0.70       # gate 6
  min_folds_positive_share: 0.60     # gate 10
  regime_min_trades: 100             # gate 13: cells judged only with >= this many trades
  min_trades: 300                    # gate 15
  min_sessions: 150                  # gate 15
  max_pbo: 0.20                      # gate 16
  min_dsr_probability: 0.95          # gate 16
  pbo_blocks: 16                     # CSCV partitions (spec OD-8)
  journal_replay_sample: 200         # gate 17: fresh seeded replay sample
  journal_replay_seed: 20261012
  feature_replay_n: 20               # gate 3: random pre-holdout timestamps recomputed
  feature_replay_seed: 20261013
  evidence:                          # committed runs the M19 run reads (ids checked)
    baseline_run: walk_forward-843056faa13a      # M7 (gate 5)
    model_run: walk_forward-8adbdf4112a5         # M9 gbm_m2 (gate 6)
    canary_run: canary-a633f3966f65              # gate 4 (ADR-0008)
    calibration_run: calibration-e19b6c392dd0    # gate 12 (ADR-0009)
    decision_run: decision-7cd0dc2805d1          # gates 10, 11, 13, 14, 15 (ADR-0010)
    journal_run: journal-4a7a186908c7            # gates 7, 17
    monitoring_run: monitoring-10b177d1695e      # gate 18

monitoring:                          # M18 drift monitoring (spec Phase 1Q, gate 18)
  window_sessions: 10                # rolling window for PSI / calibration / expectancy
  regime_window_sessions: 20         # rolling window for regime-cell frequency
  psi_bins: 10                       # reference-quantile bins
  psi_eps: 1.0e-4                    # floor for empty bins
  # PSI thresholds are calibrated to no-drift noise (owner, M18 option A): quantiles of the
  # monitor's PSI over random windows drawn from the reference period itself
  psi_null_draws: 5000
  psi_null_seed: 20261011
  psi_warn_quantile: 0.99
  psi_paper_only_quantile: 0.999
  calib_z_warn: 2.0                  # |observed - predicted| in session-clustered SE units
  calib_z_disable: 3.0
  min_trades: 20                     # expectancy monitor needs this many trades in the window
  # regime frequency only ever WARNs (above its null psi_warn_quantile)
  journal_run: journal-4a7a186908c7  # stored predictions monitored (M16)
  reference_folds: [1, 2, 3, 4]      # reference period: these folds' test blocks
  replay:                            # gate-18 replay (M18 Q4)
    n_replays: 20
    inject_at_session: 30
    seed: 20261010
    feature_shift_sd: 1.0
    win_loss_flip: 0.5               # share of WIN outcomes turned into LOSS after injection
    max_delay_sessions: 10
    max_false_alarm_replays: 1

promotion:                           # M17: Phase 1P gates mapped to spec §11 numbers (owner Q1)
  min_folds_better_share: 0.70       # gate 6: better than Model 0 in >= 70% of folds
  min_folds_positive_share: 0.60     # gate 10: positive expectancy in >= 60% of folds
  min_trades: 300                    # gate 15
  min_sessions: 150                  # gate 15
  max_ece_increase: 0.005            # no degradation vs the current model (calibration)
  candidate_fold: 7                  # the latest walk-forward fold's model is the candidate
  evidence:                          # stored runs the review reads (decision.model_family)
    model_run: walk_forward-8adbdf4112a5     # M9 gbm_m2 OOS (BSS vs Model 0, fold shares)
    canary_run: canary-a633f3966f65          # gate 4 (ADR-0008)
    calibration_run: calibration-e19b6c392dd0  # gate 12 (ADR-0009)
    decision_run: decision-7cd0dc2805d1      # trades / expectancy / regimes (ADR-0010)

journal:                             # M16
  replay_sample: 200                 # journaled predictions replayed (T-REP-02) per run
  replay_seed: 20261009

sensitivity:                         # M12 execution-assumption grid (pre-declared; one run)
  alphas: [0.0, 0.25, 0.5, 0.75, 1.0]  # moderate fill alpha (1 = conservative prices, 0 = mid)
  latencies_s: [0, 5, 60]
  cost_multipliers: [1.0, 1.5]       # scales commission + fees only

pit:
  bar_publication_lag_s: 0           # vendor-specific, set in M2
  oi_available_time: "09:30"         # OD-7

validation:
  initial_train_months: 12
  calibration_months: 2
  test_months: 3
  step_months: 3
  embargo_sessions: 1
  final_holdout_months: 6
  bootstrap_reps: 2000

# Data quality (M4, docs/DATA_QUALITY.md). Gate thresholds mirror spec §11 gates 1-2.
dq:
  max_event_recv_skew_s: 1          # ts_event may not exceed ts_recv by more than this
  strike_increment: 0.5             # QQQ standard strikes are multiples of $0.50
  min_bar_coverage: 0.98            # gate 1: per instrument-session RTH bar coverage
  min_chain_timestamp_share: 0.95   # gate 1: share of prediction timestamps with a valid chain
  min_chain_session_share: 0.95     # gate 1: share of sessions meeting the line above
  max_invalid_quote_rate: 0.02      # gate 2: rejected share, D+1 ATM ± 5, RTH
  atm_half_width: 5                 # strikes either side of ATM for the gate-2 population
  option_root: "QQQ"                # standard series root; adjusted deliverables get new roots
  # Documented OCC strike adjustments (ADR-0005). An off-grid strike is a valid standard
  # contract only if it matches one of these on/after its ex-date.
  # CRITICAL DQ events closed by an ADR (session kept; affected timestamps have no valid quote).
  resolved_critical:
    - {check: CHAIN_COVERAGE_LOW, session: "2024-02-06", adr: "ADR-0006"}
    - {check: CHAIN_COVERAGE_LOW, session: "2025-10-22", adr: "ADR-0006"}
    - {check: CHAIN_COVERAGE_LOW, session: "2026-03-10", adr: "ADR-0006"}
  strike_adjustments:
    - ex_date: "2023-12-27"
      reduction: 0.21584            # strikes reduced by this, rounded to the penny
      memo: "OCC Information Memo #53847 (QQQ special cash dividend)"

# Feature engine (M5, docs/FEATURES.md, ADR-0004). feature_version f1.
features:
  version: "f2"                     # f2: cross-market prices from NBBO mids (ADR-0004 amendment)
  momentum_minutes: [5, 15, 30, 60]
  cross_short_minutes: 15           # SPY/SOXX/megacap relative returns
  cross_long_minutes: 60            # UUP/IEF/SHY returns
  opening_range_minutes: 15
  rv_minutes: 30
  atr_sessions: 14
  rel_volume_sessions: 20
  rel_volume_min_sessions: 10
  megacap_symbols: ["NVDA", "AMD", "AVGO", "TSM"]
  megacap_min_symbols: 3
  vix_available_time: "18:00"       # ET on the VIX date: conservative (Cboe close ~16:15, file EOD)
  annualization_minutes: 98280      # 252 sessions x 390 minutes, for 1-min realized vol

# Models (M7+). Baseline = Model 0: unconditional and conditional training-set rates.
models:
  baseline:
    tod_bucket_starts: ["09:45", "11:00", "13:00"]   # ET; bucket = last start <= T
    vix_quantiles: [0.3333333333333333, 0.6666666666666666]  # train-fold VIX tercile cuts (spec §9)
    shrinkage_prior_n: 50           # Beta prior strength toward the train unconditional rate
  logistic:                         # Model 1 (M8): L2 logistic regression, fit on train only
    c_grid: [0.001, 0.01, 0.1, 1.0, 10.0]   # inverse L2 strength; chosen by calibration-block log loss
    z_clip: 5.0                     # standardised features clipped to +/- z_clip (train mean/std)
    solver: lbfgs
    max_iter: 2000
    tol: 1.0e-8
  gbm:                              # Model 2 (M9): LightGBM, fit on train only
    grid:                           # pre-declared; each point is a registered trial
      num_leaves: [7, 31]
      min_data_in_leaf: [500, 2000]
    fixed:
      objective: binary
      learning_rate: 0.03
      feature_fraction: 0.8
      bagging_fraction: 0.8
      bagging_freq: 1
      lambda_l2: 1.0
      deterministic: true
      force_row_wise: true
      num_threads: 4
      seed: 20261007
      verbosity: -1
    max_rounds: 2000
    early_stopping_rounds: 100      # on calibration-block log loss
    canary_seed: 20261008           # T-LEAK-13 training-label permutation
    canary_n_permutations: 20       # ADR-0008: mean per-fold AUC averaged over permutations
    canary_auc_tolerance: 0.02      # gate 4: OOS AUC within 0.50 +/- tolerance
    reference_m1_run: walk_forward-ae9e9d38408f   # M8 run whose saved Model 1 artifacts are compared
  metrics:
    ece_bins: 10                    # equal-count bins; identical predictions share a bin
    bootstrap_seed: 20261007        # session-block bootstrap RNG seed (reproducible CIs)
    ci_level: 0.95
