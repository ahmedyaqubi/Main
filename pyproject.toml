[project]
name = "qqq1dte"
version = "0.0.1"
description = "QQQ 1DTE research & validation engine (research only; never places orders)"
readme = "CLAUDE.md"
requires-python = ">=3.12,<3.13"
# Stack dependencies (polars, numpy, pyarrow, scikit-learn, lightgbm, sqlalchemy, alembic, ...)
# are added in the milestone that first needs them.
dependencies = [
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qqq1dte"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
xfail_strict = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "DTZ", "PL", "RUF"]
# DTZ: forbid naive datetimes — all timestamps must be tz-aware (spec: UTC storage).

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src"]
