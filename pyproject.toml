[project]
name = "qqq1dte"
version = "0.0.1"
description = "QQQ 1DTE research & validation engine (research only; never places orders)"
readme = "CLAUDE.md"
requires-python = ">=3.12,<3.13"
# Stack dependencies (polars, numpy, pyarrow, scikit-learn, lightgbm, sqlalchemy, alembic, ...)
# are added in the milestone that first needs them.
dependencies = [
    "alembic>=1.13",
    "certifi>=2025.1",
    "databento>=0.60",
    "exchange-calendars>=4.5",
    "numpy>=1.26",
    "polars>=1.0",
    "psycopg[binary]>=3.2",
    "pyarrow>=17",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "sqlalchemy>=2.0",
    "tzdata>=2025.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "pandas-stubs>=3.0.5.260914",
    "import-linter>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qqq1dte"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "tests"]
addopts = "-ra --strict-markers"
xfail_strict = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "DTZ", "PL", "RUF"]
# DTZ: forbid naive datetimes — all timestamps must be tz-aware (spec: UTC storage).

[tool.ruff.lint.pylint]
# DQ/session functions take the cleaned/rejected frames, calendar, config and sessions.
max-args = 8
max-positional-args = 8

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "PLR0913"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "scripts"]

[[tool.mypy.overrides]]
module = ["exchange_calendars", "exchange_calendars.*", "pyarrow", "pyarrow.*", "sklearn", "sklearn.*"]
ignore_missing_imports = true

[tool.importlinter]
root_package = "qqq1dte"

[[tool.importlinter.contracts]]
# T-LEAK-10 (ARCHITECTURE §4, mechanism 4): only labels/ may look forward in time.
name = "Point-in-time code never imports labels"
type = "forbidden"
source_modules = [
  "qqq1dte.features", "qqq1dte.regimes", "qqq1dte.execution_sim", "qqq1dte.core", "qqq1dte.models",
]
forbidden_modules = ["qqq1dte.labels"]
