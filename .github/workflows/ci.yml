name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qqq1dte
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: qqq1dte_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qqq1dte"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway CI container credentials, not a secret.
      TEST_DATABASE_URL: postgresql+psycopg://qqq1dte:ci-only-password@localhost:5432/qqq1dte_test
      REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Ruff
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy src
      - name: Import contracts (T-LEAK-10)
        run: uv run lint-imports
      - name: "Pytest (database tests required: REQUIRE_DB=1 turns a skip into a failure)"
        run: uv run pytest -rs
